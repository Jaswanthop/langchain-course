[project]
name = "langchain-course"
version = "0.1.0"
description = "Course project for learning LangChain"
readme = "README.md"
authors = [
    { name = "Jaswanthop", email = "jaswanth09pasala@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=0.3.0",
    "langchain-openai>=1.4.3",
    "python-dotenv>=1.2.2",
]

[project.scripts]
langchain-course = "langchain_course:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
